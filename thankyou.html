<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ขอบคุณสำหรับคำสั่งซื้อ | มาม่า</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">

  <style>
    /* สไตล์เฉพาะหน้าขอบคุณ (ส่วนที่ style.css กลางยังไม่มี) */
    .site-footer p { margin: 0; }

    .thanks {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 72px);
      min-height: calc(100svh - 72px);
      padding: var(--space-xl) 0;
      text-align: center;
    }

    .thanks__mark {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      margin: 0 auto var(--space-md);
      font-size: 1.4rem;
      color: var(--color-red);
      border: 1px solid var(--color-red);
      border-radius: 50%;
    }

    .thanks__title {
      font-family: "Playfair Display", "Noto Serif Thai", Georgia, serif;
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 400;
    }

    .thanks p { max-width: 440px; margin-left: auto; margin-right: auto; }
    .thanks .btn { margin-top: var(--space-sm); }

    @media (max-width: 768px) {
      .thanks {
        min-height: calc(100vh - 64px);
        min-height: calc(100svh - 64px);
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="logo" href="index.html">มาม่า</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="thanks">
      <div class="container">
        <div class="thanks__mark" aria-hidden="true">✓</div>
        <h1 class="thanks__title title-rule text-center">ขอบคุณสำหรับคำสั่งซื้อ</h1>
        <p>เราได้รับข้อมูลของคุณเรียบร้อยแล้ว ทางร้านจะติดต่อกลับตามช่องทางที่คุณให้ไว้</p>
        <a class="btn btn--outline" href="index.html">กลับหน้าแรก</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p>© 2026 มาม่า สงวนลิขสิทธิ์</p>
    </div>
  </footer>

</body>
</html>
